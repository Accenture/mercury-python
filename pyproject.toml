[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercury-composable"
version = "0.1.0"
description = "Lightweight Event-over-HTTP function host and client for Mercury Composable"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Accenture Technology" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10,<4",
    "msgpack>=1.0,<2",
    "PyYAML>=6.0,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/Accenture/mercury-python"
Documentation = "https://accenture.github.io/mercury-composable"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9"]

[project.scripts]
mercury-serve = "mercury_composable.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mercury_composable"]

[tool.ruff]
line-length = 100
target-version = "py310"
# the agent-skills layer is tool-managed by agent-memory (overwritten on upgrade);
# style fixes for it belong upstream, not here
extend-exclude = ["agent-skills"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
# standard mode plus the contract-relevant strictness: every parameter of a
# public-surface function is annotated (the wire contract is typed - Body,
# dict[str, str]); the reportUnknown* warning family of the editor's
# "recommended" mode is deliberately not chased. agent-skills is tool-managed
# by agent-memory and excluded.
typeCheckingMode = "standard"
reportMissingParameterType = "error"
include = ["src", "examples", "tests"]
exclude = ["agent-skills", ".venv"]

[[tool.basedpyright.executionEnvironments]]
# tests stay at standard mode - fixture/handler annotations are not enforced
root = "tests"
reportMissingParameterType = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
