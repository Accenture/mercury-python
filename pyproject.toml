[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercury-composable"
version = "4.12.1"
description = "Lightweight Event-over-HTTP function host and client for Mercury Composable"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Accenture Technology" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10,<4",
    "msgpack>=1.0,<2",
    "PyYAML>=6.0,<7",
]
keywords = ["event-driven", "composable", "microservices", "event-over-http", "mercury"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Accenture/mercury-python"
Documentation = "https://accenture.github.io/mercury-python"
Repository = "https://github.com/Accenture/mercury-python"
Changelog = "https://github.com/Accenture/mercury-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# the llm.chat demo function (examples/demo_app.py) - the package itself stays SDK-free
llm = ["anthropic>=1,<2", "google-genai>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9", "anthropic>=1,<2", "google-genai>=2,<3"]

[project.scripts]
mercury-serve = "mercury_composable.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mercury_composable"]

[tool.hatch.build.targets.sdist]
# the sdist ships the package plus its teaching surfaces - never the repo's
# agent-memory layer, skills, or CI plumbing
only-include = [
    "src/mercury_composable",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# the agent-skills layer is tool-managed by agent-memory (overwritten on upgrade);
# style fixes for it belong upstream, not here
extend-exclude = ["agent-skills"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
# standard mode plus the contract-relevant strictness: every function parameter
# is annotated, unit tests included (the wire contract is typed - Body,
# dict[str, str]); the reportUnknown* warning family of the editor's
# "recommended" mode is deliberately not chased. agent-skills is tool-managed
# by agent-memory and excluded.
typeCheckingMode = "standard"
reportMissingParameterType = "error"
include = ["src", "examples", "tests"]
exclude = ["agent-skills", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
