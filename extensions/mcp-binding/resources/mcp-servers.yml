# MCP servers by name - what is environment-specific: the transport, the credential references
# and the call timeout. The tools are not here: a tool is a function of the application, declared
# in mcp_binding.py with bind(server, tool, schema_sha256) and served under a route of its own,
# so a graph's tool catalog names the route like any other composable function.
#
# Every binding pins the SHA-256 digest of the tool's input schema (canonical JSON: keys sorted,
# no spaces). Boot fails when a bound server is not configured here, no longer offers the tool or
# changed its schema, so a server-side change stops a deploy instead of becoming run-time errors.
# Print each tool's digest and the bind line to paste with:
#
#     python extensions/mcp-binding/mcp_binding.py describe [server ...]
#
# Credentials are references: a ${NAME} placeholder resolves from this process's environment at
# boot (${NAME:default} with a default) and is never logged. A stdio server runs as a subprocess of
# this process with the SDK's minimal default environment plus the variables listed under env; an
# http server is reached at its URL with the headers listed.
#
# Keys per server: transport (stdio | http), command, args, env, cwd (stdio), url, headers (http),
# timeout_ms (per call, at least 1000; default mcp.call.timeout.ms). Unknown keys are refused by
# name. A configured server no function binds a tool of is not connected (a warning at boot).
#
servers:
  # The public Mermaid Chart MCP endpoint, reached over streamable HTTP with no credential: the
  # server behind the extension's own function mermaid.render (the Java engine's diagram-assistant
  # example calls it). Replace or extend with your servers, and declare their tools in the code.
  mermaid:
    transport: http
    url: 'https://chatgpt.mermaid.ai/anthropic/mcp'
    timeout_ms: 20000
