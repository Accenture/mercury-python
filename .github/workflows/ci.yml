name: ci

# The wrapper's quality gates (pytest, ruff, basedpyright) plus the strict
# documentation build, then gh-pages publication on push to main - the same
# verify/deploy split as the engine repo's docs workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the supported floor and the newest release the package declares (pyproject.toml): the
        # floor catches what a user on it would hit (a typing stub, a missing method), the newest the
        # deprecations ahead; every gate runs on both
        python-version: ['3.11', '3.14']
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e '.[dev]' basedpyright
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (basedpyright)
        run: basedpyright
      - name: Unit tests
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build docs (strict)
        run: mkdocs build --strict

  deploy-docs:
    # Publish to gh-pages only on push to main or manual dispatch, after both gates pass.
    if: github.event_name != 'pull_request'
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build (strict) and deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
